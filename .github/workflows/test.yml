name: test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  suites:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: work-audit suite
        run: python3 -m unittest discover -s skills/work-audit/tests
      - name: hook suites
        run: CREATE_PLAN_GUARD_SCRIPT="$PWD/hooks/create-plan-no-implement.py" python3 -m unittest discover -s hooks -p 'test_*.py'
